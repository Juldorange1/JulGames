<title>Forge PvP</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d1016; --glass: rgba(16, 20, 30, 0.72); --glass2: rgba(30, 36, 52, 0.78); --line: rgba(255,255,255,0.10);
  --txt: #eef1f7; --dim: #a3abc0; --acc: #5dd39e; --acc2: #2f9f6e; --gold: #ffd23f; --ko: #ff6b5b; --ok: #5dff7a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font: 15px/1.55 Inter, system-ui, "Segoe UI", sans-serif; overflow: hidden; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; transition: filter .4s; }
body:not(.in-game) #cv { filter: saturate(1.05) brightness(0.92); }
#cv.dim2d { filter: blur(6px) brightness(0.45) !important; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.dim { color: var(--dim); } .small { font-size: 13px; } .ok { color: var(--ok); } .ko { color: var(--ko); }
kbd { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.18); border-bottom-width: 3px; border-radius: 6px; padding: 0 6px; font: 600 13px Inter, system-ui; }
.btn { background: var(--glass2); color: var(--txt); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; font: 600 15px Inter, system-ui; cursor: pointer; transition: transform .1s, border-color .15s, background .15s; }
.btn:hover { border-color: var(--acc); transform: translateY(-1px); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #74e6b2, #3fb883); color: #08251a; border-color: #8ff0c4; box-shadow: 0 4px 0 #1f7a52, 0 10px 24px -8px rgba(93,211,158,.6); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.big { padding: 12px 22px; font-size: 16px; }

/* ---------- menu ---------- */
#menu { position: fixed; inset: 0; z-index: 2; overflow: hidden; padding: 0 8px; display: flex; justify-content: center; align-items: flex-start; background: linear-gradient(180deg, rgba(8,10,16,0.55), rgba(8,10,16,0.15) 30%, rgba(8,10,16,0.65)); }
body.in-game #menu { display: none; }
#menu-inner { width: 1600px; flex: none; padding-bottom: 8px; }
.mhead { max-width: 1320px; margin: 0 auto; padding: 18px 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.logo { font-family: "Press Start 2P", monospace; font-size: 30px; line-height: 1.2; color: #fff; text-shadow: 3px 3px 0 #1f7a52, 6px 6px 0 rgba(0,0,0,.35); letter-spacing: 2px; animation: float 4s ease-in-out infinite; }
.logo span { color: var(--acc); }
@keyframes float { 50% { transform: translateY(-4px); } }
.tagline { color: #dfe6f3; margin-top: 8px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.hright { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#sensinfo { font-size: 13px; color: #dfe6f3; text-shadow: 0 1px 4px #000; }
.back { color: #dfe6f3; text-decoration: none; font-size: 14px; }
#menu-body { max-width: 1320px; margin: 0 auto; }
.toolbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--glass); color: var(--txt); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; font: 600 14px Inter, system-ui; cursor: pointer; backdrop-filter: blur(8px); }
.chip.on { background: var(--acc); color: #08251a; border-color: var(--acc); }
.seg { display: flex; background: var(--glass); border: 1px solid var(--line); border-radius: 12px; padding: 3px; backdrop-filter: blur(8px); }
.seg button { background: none; border: 0; color: var(--dim); font: 600 14px Inter, system-ui; padding: 6px 14px; border-radius: 9px; cursor: pointer; }
.seg button.on { background: linear-gradient(180deg, #ffe27a, #f2b821); color: #3a2a00; }
.modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
.modes .mode { flex: 0 1 calc(20% - 12px); min-width: 0; padding: 13px; }
.mtxt p { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; } .mbest { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 800px) and (max-aspect-ratio: 1/1) { #menu-inner { width: 100%; } .modes .mode { flex-basis: calc(50% - 7px); min-width: 0; } }
.mode { display: flex; flex-direction: column; gap: 10px; text-align: left; color: var(--txt); font: inherit; cursor: pointer; padding: 16px; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: transform .15s, border-color .15s, box-shadow .15s; animation: cardIn .45s both; position: relative; overflow: hidden; }
.mode::before { content: ''; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%); transform: translateX(-100%); transition: transform .6s; }
.mode:hover::before { transform: translateX(100%); }
.mode:hover { transform: translateY(-3px); border-color: rgba(93,211,158,.7); box-shadow: 0 14px 34px -12px rgba(93,211,158,.45); }
@keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(.98); } }
.mico { width: 62px; height: 62px; flex: none; display: grid; place-items: center; background: radial-gradient(circle at 40% 30%, rgba(255,255,255,.14), rgba(0,0,0,.2)); border: 1px solid var(--line); border-radius: 14px; }
.mico img { width: 44px; height: 44px; image-rendering: pixelated; transition: transform .2s; }
.mode:hover .mico img { transform: scale(1.12) rotate(-6deg); }
.mcat { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.mtxt h3 { margin: 0; font-size: 18px; } .mtxt p { margin: 6px 0; color: #c3c9d8; font-size: 13.5px; line-height: 1.45; }
.comp { color: var(--acc); font-size: 13px; font-weight: 600; }
.mbest { font-size: 13px; }
.hist { padding: 14px 18px; } .hist h3 { margin: 0 0 6px; font-size: 16px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; } .tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line); }

/* ---------- réglages ---------- */
#settings { position: fixed; inset: 0; z-index: 30; background: rgba(5,7,12,.6); display: grid; place-items: center; place-content: center; overflow: hidden; backdrop-filter: blur(4px); }
#settings[hidden] { display: none; }
.sbox { width: 1180px; padding: 18px 22px; }
.setgrid { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 6px 26px; align-items: start; }
.setgrid section h3 { margin: 6px 0 6px; color: var(--acc); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
.setgrid .row { display: grid; grid-template-columns: 112px 1fr auto; align-items: center; gap: 10px; margin: 6px 0; font-size: 14px; font-weight: 600; }
.setgrid .row input[type=number], .setgrid .row select { width: 100%; }
.setgrid .chk { font-size: 14px; } .setgrid .keys { grid-template-columns: 1fr; gap: 6px; } .setgrid .krow { font-size: 14px; }
.setgrid .btn.key { min-width: 120px; padding: 6px 12px; }
@media (max-width: 900px) and (max-aspect-ratio: 1/1) { .sbox { width: 96vw; } .setgrid { grid-template-columns: 1fr; } }
.sbox header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; } .sbox h2 { margin: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px 28px; }
.grid2 section h3 { margin: 10px 0 4px; color: var(--acc); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; }
.span2 { grid-column: 1 / -1; }
.row { display: flex; align-items: center; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
.row input[type=range] { flex: 1 1 140px; accent-color: var(--acc); }
.row input[type=number], .row select, .cps-opts select { background: var(--glass2); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; width: 120px; }
.row output { min-width: 64px; font-weight: 700; }
.chk { display: flex; gap: 8px; align-items: center; margin: 7px 0; cursor: pointer; } .chk input { accent-color: var(--acc); width: 16px; height: 16px; }
.calc { background: var(--glass2); padding: 8px 12px; border-radius: 10px; font-size: 14px; }
.keys { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 6px 22px; }
.krow { display: flex; justify-content: space-between; align-items: center; gap: 10px; } .btn.key { min-width: 140px; } .btn.key.wait { border-color: var(--gold); color: var(--gold); }

/* ---------- HUD ---------- */

#hud { position: fixed; inset: 0; z-index: 3; pointer-events: none; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,.75); }
#hud[hidden] { display: none; }
#hud-info { position: absolute; left: 14px; top: 12px; padding: 9px 13px; background: rgba(0,0,0,.38); border-radius: 10px; font-size: 15px; max-width: 60vw; }
.hud-mode { font-weight: 800; color: #b7ffd8; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
#hud-info .dim { color: #d5d9e6; }
#hud-timer { position: absolute; right: 16px; top: 12px; font: 800 26px Inter, system-ui; background: rgba(0,0,0,.38); padding: 3px 14px; border-radius: 10px; }
#hud-center { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%); font: 400 84px "Press Start 2P", monospace; color: #fff; text-shadow: 5px 5px 0 rgba(0,0,0,.45); }
#hud-center.pop { animation: cdPop .9s both; }
@keyframes cdPop { 0% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { opacity: .2; transform: translate(-50%, -50%) scale(.85); } }
#crosshair { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); mix-blend-mode: difference; }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; }
#crosshair::before { left: 0; right: 0; top: 9px; height: 2px; } #crosshair::after { top: 0; bottom: 0; left: 9px; width: 2px; }
#cooldown { position: absolute; left: 50%; top: calc(50% + 16px); width: 22px; height: 5px; transform: translateX(-50%); background: rgba(0,0,0,.55); }
#cooldown > div { height: 100%; background: #cfcfcf; }
#cooldown.done { background: none; } #cooldown.done > div { display: none; }
#cooldown.full::after { content: ''; position: absolute; left: 50%; top: -2px; width: 10px; height: 10px; background: #fff; transform: translateX(-50%) rotate(45deg); }
#cooldown[hidden] { display: none; }
#hud-sub { position: absolute; left: 50%; top: calc(50% + 34px); transform: translateX(-50%); text-align: center; font: 800 16px Inter, system-ui; white-space: nowrap; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 45%, rgba(190,0,0,.75) 100%); opacity: 0; }
#bottom { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
.barrow { display: flex; gap: 1px; width: 364px; } .barrow img { width: 18px; height: 18px; image-rendering: pixelated; }
#hearts.shake img { animation: hshake .3s infinite; } #hearts.shake img:nth-child(odd) { animation-delay: .1s; }
@keyframes hshake { 50% { transform: translateY(-2px); } }
#armorbar { justify-content: flex-start; }
#hotbar { display: flex; background: rgba(0,0,0,.45); border: 3px solid rgba(0,0,0,.6); outline: 2px solid rgba(255,255,255,.18); }
.hb { width: 44px; height: 44px; border: 2px solid rgba(255,255,255,.12); display: grid; place-items: center; position: relative; }
.hb.sel { border: 3px solid #fff; box-shadow: 0 0 0 2px #000 inset; }
.hb img { width: 30px; height: 30px; image-rendering: pixelated; } .hb span { position: absolute; right: 2px; bottom: 0; font: 700 13px Inter, system-ui; }
.hud-b { position: absolute; right: 16px; bottom: 12px; font-size: 12px; opacity: .7; }

/* ---------- panneaux ---------- */
#msg { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; place-content: center; background: radial-gradient(circle at 50% 40%, rgba(8,10,16,.35), rgba(8,10,16,.75)); overflow: hidden; }
#msg[hidden], #ecran2d[hidden] { display: none; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 22px 26px; width: 660px; text-align: center; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
.pop-in { animation: popIn .32s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes popIn { from { opacity: 0; transform: scale(.9) translateY(10px); } }
.panel h2 { margin: 4px 0 10px; font-size: 26px; }
.picon img { width: 64px; height: 64px; image-rendering: pixelated; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); animation: float 3s ease-in-out infinite; }
.tips { background: rgba(255,255,255,.06); border: 1px solid var(--line); padding: 10px 14px; border-radius: 12px; text-align: left; line-height: 1.9; }
.btns { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; } .btns.col { flex-direction: column; align-items: center; } .btns.col .btn { min-width: 220px; }
.score-big { font: 800 54px Inter, system-ui; background: linear-gradient(180deg, #a8ffd6, #3fc189); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 4px 12px rgba(93,211,158,.35)); }
.res.lose .score-big { background: linear-gradient(180deg, #ffd0c9, #ff6b5b); -webkit-background-clip: text; background-clip: text; }
.rec { color: var(--dim); } .rec.gold { color: var(--gold); font-weight: 800; animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { text-shadow: 0 0 14px rgba(255,210,63,.8); } }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 14px 0; }
.panel.res { width: 980px; } @media (max-width: 800px) and (max-aspect-ratio: 1/1) { .panel.res { width: 96vw; } }
.panel.res .advice ul { columns: 2; column-gap: 28px; } .panel.res .advice li { break-inside: avoid; margin-top: 0; }
.stat { background: rgba(255,255,255,.06); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; border-left: 3px solid var(--line); animation: cardIn .4s both; }
.stat span { color: var(--dim); font-size: 13px; } .stat b { font-size: 19px; }
.stat.good { border-color: var(--acc); } .stat.bad { border-color: #ffb547; }
.advice { text-align: left; } .advice h3 { margin: 8px 0 4px; } .advice ul { padding-left: 20px; margin: 0; } .advice li { margin: 5px 0; }

/* ---------- exercices 2D ---------- */
#ecran2d { position: fixed; inset: 0; z-index: 5; overflow: hidden; display: grid; place-items: center; place-content: center; }
.drill { width: 800px; display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative; }
.drill.danger::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse, transparent 50%, rgba(255,40,40,.25)); animation: pulse .6s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .4; } }
.drill-top { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; }
.drill-status { font-size: 22px; font-weight: 800; min-height: 34px; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
.drill .tips { background: var(--glass); color: #d3d9e6; }
.totem-pop { position: fixed; left: 50%; top: 40%; width: 160px; height: 160px; image-rendering: pixelated; transform: translate(-50%, -50%); pointer-events: none; animation: totem 1.1s ease-out both; z-index: 2; }
@keyframes totem { 0% { transform: translate(-50%, -20%) scale(.3) rotate(-30deg); opacity: 0; } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(8deg); } 60% { transform: translate(-50%, -55%) scale(1) rotate(-4deg); opacity: 1; } 100% { transform: translate(-50%, -80%) scale(.7); opacity: 0; } }
.mc-inv { background: #c6c6c6; border: 3px solid; border-color: #fff #555 #555 #fff; padding: 10px; border-radius: 4px; color: #3f3f3f; box-shadow: 0 20px 50px rgba(0,0,0,.5); transition: transform .12s, opacity .12s; }
.mc-inv.closed { visibility: hidden; opacity: 0; transform: scale(.96); } .mc-inv.open { opacity: 1; }
.inv-title { font-family: "Press Start 2P", monospace; font-size: 10px; margin-bottom: 8px; }
.grid9 { display: grid; grid-template-columns: repeat(9, 52px); gap: 2px; } .hb-in { margin-top: 10px; }
.slot { width: 52px; height: 52px; background: #8b8b8b; border: 2px solid; border-color: #373737 #fff #fff #373737; position: relative; display: grid; place-items: center; }
.slot:hover { background: #b5b5b5; }
.slot img { width: 36px; height: 36px; image-rendering: pixelated; pointer-events: none; transition: transform .1s; } .slot:hover img { transform: scale(1.1); }
.slot span { position: absolute; right: 3px; bottom: 0; color: #fff; font: 700 13px Inter, system-ui; text-shadow: 1px 1px 0 #3f3f3f; pointer-events: none; }
.hud-hotbar { display: flex; gap: 14px; align-items: center; }
.hud-hotbar .slot { background: rgba(40,40,40,.85); border-color: #222 #777 #777 #222; }
.hud-hotbar .slot.sel { outline: 3px solid #fff; outline-offset: -1px; z-index: 1; }
.cps-opts { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.cps-zone { width: 100%; height: 320px; background: var(--glass); border: 2px dashed rgba(93,211,158,.6); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; cursor: pointer; position: relative; overflow: hidden; backdrop-filter: blur(10px); }
.cps-big { font: 800 52px Inter, system-ui; color: var(--acc); z-index: 1; }
.cps-ring { position: absolute; left: 0; bottom: 0; height: 5px; width: calc(var(--p, 0) * 100%); background: linear-gradient(90deg, var(--acc), var(--gold)); }
.ripple { position: absolute; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--acc); transform: translate(-50%, -50%); animation: rip .5s ease-out forwards; pointer-events: none; }
@keyframes rip { to { width: 120px; height: 120px; opacity: 0; } }
.chart { width: 100%; max-width: 640px; height: auto; border-radius: 10px; }
.fatal { position: fixed; inset: auto 16px 16px; z-index: 99; background: #5a1d1d; padding: 12px 16px; border-radius: 10px; }

/* ---------- configuration de partie ---------- */
.panel.cfg { width: 1120px; text-align: left; padding: 18px 22px; }
.cfghead { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.cfghead .ct { flex: 1; min-width: 0; } .cfghead h2 { margin: 0 0 2px; font-size: 24px; } .cfghead p { margin: 0; font-size: 14px; }
.cfghead .picon img { width: 48px; height: 48px; animation: none; }
.watch { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); cursor: pointer; flex: none; user-select: none; }
.watch input { display: none; } .watch .eye { font-size: 22px; filter: grayscale(1); opacity: .6; }
.watch b { display: block; font-size: 14px; } .watch small { color: var(--dim); font-size: 12px; }
.watch i { width: 38px; height: 22px; border-radius: 99px; background: #3a4052; position: relative; transition: background .15s; }
.watch i::after { content: ''; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.watch.on { border-color: var(--acc); background: rgba(93,211,158,.12); } .watch.on .eye { filter: none; opacity: 1; }
.watch.on i { background: var(--acc); } .watch.on i::after { left: 19px; }
.cfgbody { display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start; }
.cfgbody aside { display: flex; flex-direction: column; gap: 10px; }
.sec { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--acc); font-weight: 800; margin-bottom: 6px; }
.presets { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.pchips { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
.pchip, .pchip button { background: var(--glass2); color: var(--txt); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font: 600 13px Inter, system-ui; cursor: pointer; text-align: left; }
.pchip:hover, .pchip button:hover { border-color: var(--acc); }
.pchip.mine { padding: 0; display: flex; border: 0; background: none; } .pchip.mine button:first-child { flex: 1; border-radius: 9px 0 0 9px; border-color: rgba(255,210,63,.5); }
.pchip.mine .del { border-radius: 0 9px 9px 0; padding: 6px 10px; color: var(--ko); border-left: 0; }
.pchip.ghost { background: none; color: var(--dim); }
.psave { display: flex; gap: 6px; } .psave input { flex: 1; min-width: 0; background: var(--glass2); color: var(--txt); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; font: inherit; font-size: 13px; }
.psave .btn { padding: 6px 12px; }
.cfgmain { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cfgbody .tips { font-size: 13px; line-height: 1.75; padding: 10px 12px; }
.fields { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: row dense; gap: 4px 22px; align-content: start; }
.frow { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr); align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); min-height: 48px; }
.frow.wide { grid-column: 1 / -1; grid-template-columns: minmax(0, calc(20% - 4px)) minmax(0, 1fr); }
.flabel { font-weight: 700; font-size: 14px; line-height: 1.25; }
.hint { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: rgba(255,255,255,.12); color: var(--dim); font-size: 11px; cursor: help; vertical-align: 1px; }
.fctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.fctl .grow { flex: 1 1 auto; min-width: 50px; }
.fctl input[type=range] { accent-color: var(--acc); }
.fctl input[type=number], .fctl select { background: var(--glass2); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 14px; }
.fctl input.num { width: 64px; flex: none; } .fctl select { width: 100%; } .fctl input:disabled { opacity: .35; }
.unit { color: var(--dim); font-size: 13px; flex: none; }
.inf { display: inline-flex; gap: 5px; align-items: center; font-weight: 700; font-size: 13px; color: var(--dim); cursor: pointer; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); flex: none; user-select: none; }
.inf input { display: none; } .inf.on { color: #3a2a00; background: var(--gold); border-color: var(--gold); }
.difflabel { font-weight: 800; color: var(--gold); min-width: 140px; flex: none; font-size: 14px; }
.diffrow .fctl input[type=range] { background: linear-gradient(90deg, #5dd39e, #ffd23f, #ff6b5b); height: 6px; border-radius: 99px; -webkit-appearance: none; appearance: none; }
.diffrow .fctl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid #222; cursor: pointer; }
.switch { position: relative; width: 44px; height: 24px; flex: none; cursor: pointer; }
.switch input { display: none; } .switch span { position: absolute; inset: 0; border-radius: 99px; background: #3a4052; transition: background .15s; }
.switch span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch input:checked + span { background: var(--acc); } .switch input:checked + span::after { left: 23px; }
.cfgfoot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
@media (max-width: 900px) and (max-aspect-ratio: 1/1) { .panel.cfg { width: 96vw; } .cfgbody { grid-template-columns: 1fr; } .pchips { flex-direction: row; flex-wrap: wrap; } .fields { grid-template-columns: 1fr; } .frow.wide { grid-template-columns: minmax(110px, 44%) 1fr; } }
.hb em { position: absolute; left: 3px; top: 0; font: 700 11px Inter, system-ui; font-style: normal; opacity: .75; }
@media (max-width: 700px) { .diffbar { padding-right: 0; } }

.cps-zone { height: auto !important; padding: 16px; gap: 10px; }
.cps-live { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; z-index: 1; }
.cps-live div { background: rgba(255,255,255,.06); border-radius: 10px; padding: 6px 8px; text-align: center; }
.cps-live span { display: block; font-size: 11px; color: var(--dim); } .cps-live b { font: 800 20px Inter, system-ui; color: var(--acc); font-variant-numeric: tabular-nums; }
.cps-canvas { width: 100%; height: auto; border-radius: 10px; z-index: 1; pointer-events: none; }
.panel.cps-res { width: 940px; }
.persec { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-bottom: 10px; }
.persec span { background: rgba(255,255,255,.06); border-radius: 8px; padding: 3px 7px; min-width: 38px; } .persec b { display: block; font-size: 15px; } .persec i { font-style: normal; font-size: 10px; color: var(--dim); }
@media (max-width: 700px) {
  .logo { font-size: 20px; }
  .grid9 { grid-template-columns: repeat(9, 34px); } .slot { width: 34px; height: 34px; } .slot img { width: 24px; height: 24px; }
  .barrow { width: 300px; } .hb { width: 34px; height: 34px; } .hb img { width: 24px; height: 24px; }
}
@media (prefers-reduced-motion: reduce) { .logo, .mode, .picon img { animation: none !important; } }
#ind { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
#ind i { position: absolute; left: -9px; top: -9px; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 16px solid #ff4d3d; filter: drop-shadow(0 0 4px rgba(0,0,0,.8)); }
/* ---------- artisanat : fenêtre de l'établi façon Minecraft ---------- */
.drill.craft { width: 820px; }
.cr-target { display: flex; align-items: center; gap: 14px; padding: 10px 16px; width: 100%; }
.cr-target img { width: 52px; height: 52px; image-rendering: pixelated; }
.cr-target b { font-size: 20px; }
.cr-time { font: 800 26px Inter, system-ui; min-width: 120px; text-align: center; }
.cr-help { margin-left: auto; display: flex; align-items: center; gap: 10px; min-height: 84px; }
.cr-mini { display: grid; grid-template-columns: repeat(3, 26px); gap: 2px; }
.cr-mini div { width: 26px; height: 26px; background: #8b8b8b; border: 1px solid #373737; }
.cr-mini img { width: 24px; height: 24px; image-rendering: pixelated; }
.mc-win { position: relative; background: #c6c6c6; border: 3px solid; border-color: #fff #555 #555 #fff; border-radius: 5px; padding: 12px 16px 16px; color: #3f3f3f; user-select: none; box-shadow: 0 0 0 2px #000, 0 20px 50px rgba(0,0,0,.5); cursor: default; }
.mc-win.ok { box-shadow: 0 0 0 3px #5dd39e, 0 0 34px rgba(93,211,158,.7); }
.mc-title { font: 700 15px/1 Inter, system-ui; color: #404040; margin: 4px 0 8px; }
.mc-craft { display: flex; align-items: center; gap: 26px; margin: 0 0 12px 70px; }
.mc-grid { display: grid; grid-template-columns: repeat(3, 44px); }
.mc-inv, .mc-hot { display: grid; grid-template-columns: repeat(9, 44px); }
.mc-hot { margin-top: 12px; }
.mc-slot { width: 44px; height: 44px; background: #8b8b8b; border: 2px solid; border-color: #373737 #fff #fff #373737; position: relative; box-sizing: border-box; }
.mc-slot img { width: 36px; height: 36px; position: absolute; left: 2px; top: 2px; image-rendering: pixelated; pointer-events: none; }
.mc-slot span, .mc-cursor span { position: absolute; right: 1px; bottom: -2px; font: 800 15px Inter, system-ui; color: #fff; text-shadow: 2px 2px 0 #3f3f3f; pointer-events: none; }
.mc-slot.hov::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,.45); pointer-events: none; }
.mc-res { width: 58px; height: 58px; } .mc-res img { width: 46px; height: 46px; left: 4px; top: 4px; }
.mc-arrow { font-size: 36px; color: #8b8b8b; }
.mc-cursor { position: absolute; width: 36px; height: 36px; pointer-events: none; z-index: 5; }
.mc-cursor img { width: 36px; height: 36px; image-rendering: pixelated; }
.mc-pointer { position: absolute; width: 0; height: 0; z-index: 6; pointer-events: none; border-style: solid; border-width: 0 7px 16px 7px; border-color: transparent transparent #fff transparent; transform: rotate(-28deg); transform-origin: 0 0; filter: drop-shadow(1px 1px 0 #000); }
.mc-tip { position: absolute; background: rgba(16,0,16,.94); color: #fff; border: 2px solid #2a0a5e; padding: 3px 8px; font: 600 13px Inter, system-ui; z-index: 7; pointer-events: none; white-space: nowrap; }
.cr-cd { position: absolute; inset: 0; display: grid; place-items: center; font: 900 96px Inter, system-ui; color: #fff; text-shadow: 0 5px 0 #000; pointer-events: none; }
.cr-cd.pop { animation: popIn .3s cubic-bezier(.2,1.4,.4,1); }
/* HUD à l'échelle de l'écran (doit rester en dernier) */
:root { --hs: 1; }
#hud-info { transform: scale(var(--hs)); transform-origin: 0 0; }
#hud-timer { transform: scale(var(--hs)); transform-origin: 100% 0; }
#bottom { transform: translateX(-50%) scale(var(--hs)) !important; transform-origin: 50% 100%; }
#crosshair { transform: translate(-50%, -50%) scale(var(--hs)); }
#cooldown { transform: translateX(-50%) scale(var(--hs)); transform-origin: 50% 0; top: calc(50% + 16px * var(--hs)) !important; }
#ind { transform: scale(var(--hs)); }
#hud-sub { transform: translateX(-50%) scale(var(--hs)); transform-origin: 50% 0; top: calc(50% + 34px * var(--hs)) !important; }
#hud-center { font-size: calc(84px * var(--hs)) !important; }
.hud-b { transform: scale(var(--hs)); transform-origin: 100% 100%; }
</style>
