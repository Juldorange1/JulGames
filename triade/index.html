<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>/* ?muet dans l'adresse : aucun son (tests automatiques) */if(/[?&]muet\b/.test(location.search)){(function(){var A=window.AudioContext||window.webkitAudioContext;if(A){var M=function(o){var c=new A(o);var g=c.createGain();try{Object.defineProperty(c,'destination',{value:g})}catch(e){}try{c.suspend()}catch(e){}c.resume=function(){return Promise.resolve()};return c};M.prototype=A.prototype;window.AudioContext=window.webkitAudioContext=M;}var P=HTMLMediaElement.prototype;P.play=function(){this.muted=true;return Promise.resolve()};})()}</script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Triade — JulGame</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0d15">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-screen="scr-title">

<!-- ============ TITRE ============ -->
<section id="scr-title" class="screen on">
  <div class="title-bg"></div>
  <div class="title-box">
    <div class="logo-tokens"><span style="--c:#ff8a3d"></span><span style="--c:#5ad0ff"></span><span style="--c:#c08cff"></span></div>
    <h1 class="logo">TRIADE</h1>
    <p class="tagline">Trois héros. Des salles sans fin. Aucun point de vie : seulement ton <b>% de dégâts</b>.</p>
    <div class="title-btns">
      <button class="btn big" id="btn-continue">Continuer</button>
      <button class="btn big" id="btn-new">Nouvelle partie</button>
      <button class="btn big daily" id="btn-daily" title="La même partie pour tout le monde aujourd’hui : 20 salles, un score à battre">Épreuve du jour</button>
      <div class="title-row"><button class="btn ghost" id="btn-feats" title="Objectifs à long terme (gardés d’une partie à l’autre)">Hauts faits</button>
      <button class="btn ghost" id="btn-help">Comment jouer</button></div>
      <button class="btn ghost" id="btn-quit" style="display:none">Quitter le jeu</button>
    </div>
    <div class="title-rec" id="title-rec"></div>
    <div class="title-lang" id="title-lang"></div>
    <a class="back" href="../index.html">← JulGame</a>
  </div>
</section>

<!-- ============ CHOIX DES HÉROS ============ -->
<section id="scr-pick" class="screen">
  <div class="page">
    <header class="page-head"><button class="btn ghost small" id="btn-pick-back">← Retour</button><h2>Choisis ton trio</h2><span></span></header>
    <div id="pick-list" class="pick-list"></div>
    <div class="pick-demo" id="pick-demo"><canvas id="pick-canvas"></canvas><div id="pick-info"></div></div>
    <div class="pick-foot"><div class="pick-lvl"><span class="lbl">Difficulté</span><div id="pick-level"></div></div>
    <button class="btn big" id="btn-start" disabled>Jouer</button></div>
  </div>
</section>

<!-- ============ CHOIX DE LA SALLE ============ -->
<section id="scr-choice" class="screen">
  <div class="page">
    <header class="page-head">
      <div class="ph-left"><b id="ch-depth">Salle 1</b><small id="ch-era"></small></div>
      <div class="ph-mid"><span class="gold" id="ch-gold" title="Or : sert à graver et aux talents (Atelier)"></span><button class="btn ghost" id="ch-level" title="Paramètres : difficulté, son, vitesse…"></button></div>
      <div class="ph-right">
        <button class="btn small gold" id="btn-atelier" title="Atelier : graver des effets pour toujours, acheter des talents (A)">Atelier</button>
        <button class="btn ghost small icon-btn" id="btn-ch-codex" title="Codex (K)"></button>
        <button class="btn ghost small icon-btn" id="btn-ch-help" title="Comment jouer (H)"></button>
        <button class="btn ghost small icon-btn" id="btn-ch-menu" title="Menu"></button>
      </div>
    </header>
    <div id="ch-notes" class="notes"></div>
    <div class="choice-grid">
      <aside class="choice-side">
        <div id="ch-heroes"></div>
        <div id="ch-effects" class="effects"></div>
      </aside>
      <main class="choice-main">
        <div class="doors-head"><span>Prochaine salle</span><span id="ch-bosschance" class="bchance" title="Chance qu’une porte mène à un boss"></span></div>
        <div id="ch-doors" class="doors"></div>
      </main>
    </div>
  </div>
</section>

<!-- ============ COMBAT ============ -->
<section id="scr-combat" class="screen">
  <header class="cb-top">
    <div class="cb-left"><button class="btn ghost small icon-btn" id="btn-cb-menu" title="Menu"></button><span id="cb-depth"></span></div>
    <div id="cb-top-mid" class="cb-mid"></div>
    <div class="cb-right">
      <button class="btn ghost small" id="btn-preview" title="Prévision du tour ennemi (P)"></button>
      <button class="btn ghost small" id="btn-danger" title="Zones de danger (D)"></button>
      <button class="btn ghost small icon-btn" id="btn-cb-codex" title="Codex (K)"></button>
      <button class="btn ghost small" id="btn-flee"></button>
    </div>
  </header>
  <div id="boss-bar" class="boss-bar"></div>
  <div class="cb-board"><canvas id="board"></canvas><div id="cb-warn" class="cb-warn"></div></div>
  <footer class="cb-bottom">
    <div class="hero-panel" id="hp-0"></div>
    <div class="hero-panel" id="hp-1"></div>
    <div class="hero-panel" id="hp-2"></div>
    <div class="cb-ctrl">
      <button class="btn big" id="btn-end" title="Finir le tour : les ennemis jouent (Espace)">Fin du tour</button>
      <button class="btn ghost" id="btn-undo" title="Annuler le dernier déplacement (Z)"></button>
      <div id="cb-info" class="info"></div>
    </div>
  </footer>
</section>

<div class="rotate-hint" id="rotate-hint"><div class="ph"></div><p id="rot-txt">Tourne ton appareil pour jouer à l’horizontale</p><button class="btn ghost" id="btn-keep-portrait">Rester à la verticale</button></div>
<div id="modal" class="modal"></div>
<div id="toasts" class="toasts"></div>
<div id="tip" class="tip"></div>

<script src="js/i18n.js"></script>
<script src="js/lang/en.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/codex.js"></script>
<script src="js/main.js"></script>
<script src="js/gamepad.js"></script>
</body>
</html>
