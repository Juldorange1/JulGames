<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>/* ?muet dans l'adresse : aucun son (tests automatiques) */if(/[?&]muet\b/.test(location.search)){(function(){var A=window.AudioContext||window.webkitAudioContext;if(A){var M=function(o){var c=new A(o);var g=c.createGain();try{Object.defineProperty(c,'destination',{value:g})}catch(e){}try{c.suspend()}catch(e){}c.resume=function(){return Promise.resolve()};return c};M.prototype=A.prototype;window.AudioContext=window.webkitAudioContext=M;}var P=HTMLMediaElement.prototype;P.play=function(){this.muted=true;return Promise.resolve()};})()}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panthéa</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="bgForest" aria-hidden="true"></div>

<!-- ===== Menu ===== -->
<section id="menu" class="screen on">
  <div class="menu-wrap">
    <div class="glass menu-main">
      <h1>Panthéa</h1>
      <p class="tag" data-l="Recrute, place, active. Tue les dieux adverses… ou 4 de leurs gardes."></p>
      <p class="hello" id="hello"></p>
      <div id="slots"></div>
      <div class="menu-actions">
        <button class="ghost" id="btnDuelMenu" data-l="⚔️ Duel"></button>
        <button class="ghost" id="btnExtMenu" data-l="🧩 Extensions"></button>
        <button class="ghost" id="btnTutoMenu" data-l="🎓 Tutoriel"></button>
        <button class="ghost" id="btnCodexMenu" data-l="📖 Codex"></button>
        <button class="ghost" id="btnAchMenu" data-l="🏆 Succès"></button>
        <button class="ghost" id="btnReplayMenu" data-l="🎬 Revoir"></button>
        <button class="ghost" id="btnSetMenu" data-l="⚙️ Paramètres"></button>
        <button class="ghost" id="btnQuit" hidden data-l="Quitter"></button>
      </div>
    </div>
    <div class="glass daily" id="dailyBox"></div>
  </div>
</section>

<!-- ===== Nouvelle partie ===== -->
<section id="newrun" class="screen">
  <div class="glass panel-mid">
    <h2 class="title" data-l="Nouvelle partie"></h2>
    <div class="levels" id="levels"></div>
    <div class="menu-actions"><button class="ghost" id="btnNewBack" data-l="Retour"></button></div>
  </div>
</section>

<!-- ===== Duel (bot, à deux, en ligne) ===== -->
<section id="duel" class="screen">
  <div class="glass panel-mid wide" id="duelBox"></div>
</section>

<!-- ===== Extensions (DLC), histoire, saison ===== -->
<section id="ext" class="screen"><div class="glass panel-mid wide" id="extBox"></div></section>
<section id="story" class="screen"><div class="glass panel-mid wide" id="storyBox"></div></section>
<section id="season" class="screen"><div class="glass panel-mid wide" id="seasonBox"></div></section>

<!-- ===== Partie (entre deux affrontements) ===== -->
<section id="run" class="screen">
  <div class="glass panel-mid wide" id="runBox"></div>
</section>

<!-- ===== Avant l'affrontement (événement / pari / défi) ===== -->
<section id="pre" class="screen">
  <div class="glass panel-mid" id="preBox"></div>
</section>

<!-- ===== Affrontement ===== -->
<section id="game" class="screen">
  <header class="bar">
    <button class="ghost sm" id="btnMenu">☰ <span class="lbl" data-l="Retour"></span></button>
    <button class="ghost sm" id="btnUndo">↶ <span class="lbl" data-l="Annuler le coup"></span></button>
    <div id="runBadge" class="badge run"></div>
    <div id="evBadge" class="badge" hidden></div>
    <div id="goalBadge" class="badge goal" hidden></div>
    <div id="mapBadge" class="badge map"></div>
    <div class="grow"></div>
    <button class="ghost sm dockb" id="btnSheetPool">➕ <span class="lbl" data-l="Réserve"></span></button>
    <button class="ghost sm dockb" id="btnSheetInfo">ℹ️ <span class="lbl" data-l="Infos"></span></button>
    <button class="ghost sm dockb" id="btnSheetLog">📜 <span class="lbl" data-l="Journal"></span></button>
    <button class="ghost sm icon" id="btnMusic">🎵</button>
    <button class="ghost sm icon" id="btnSfx">🔊</button>
    <button class="ghost sm icon" id="btnCodex" title="Codex (C)">📖</button>
    <button class="ghost sm icon" id="btnSet">⚙️</button>
  </header>

  <div class="layout">
    <div class="col left">
      <div class="pp" id="pp1"></div>
      <div class="pp" id="pp0"></div>
    </div>
    <div class="col mid">
      <div class="turnline" id="turnline"></div>
      <div id="boardBox"><div id="terrain">
        <div id="board"></div>
        <div id="fx"></div>
      </div></div>
      <div class="hint" id="hint"></div>
      <div class="opts" id="opts"></div>
    </div>
    <div class="col right">
      <button class="x sheetx" id="sheetClose">×</button>
      <div class="glass card" id="poolCard">
        <h3 id="poolTitle"></h3>
        <div id="pool"></div>
      </div>
      <div class="glass card" id="infoCard"></div>
      <div class="glass card logcard">
        <h3 data-l="Journal"></h3>
        <ul id="log"></ul>
      </div>
    </div>
  </div>
</section>

<!-- ===== Fenêtres ===== -->
<div class="modal" id="codexModal" hidden>
  <div class="mbox wide glass codex">
    <button class="x" data-close>×</button>
    <h2 class="title" data-l="📖 Codex"></h2>
    <div class="tabs" id="codexTabs"></div>
    <div id="codexBody"></div>
    <div class="pager" id="codexPager"></div>
  </div>
</div>

<div class="modal" id="setModal" hidden>
  <div class="mbox glass settings">
    <button class="x" data-close>×</button>
    <h2 class="title" data-l="⚙️ Paramètres"></h2>
    <div id="setBody"></div>
  </div>
</div>

<div class="modal" id="endModal" hidden>
  <div class="mbox glass wide bilanbox"><div id="bilan"></div></div>
</div>

<div class="modal" id="statsModal" hidden>
  <div class="mbox wide glass codex">
    <button class="x" data-close>×</button>
    <h2 class="title" data-l="📊 Statistiques"></h2>
    <div class="tabs" id="statsTabs"></div>
    <div id="statsBody" class="pbody"></div>
    <div class="pager" id="statsPager"></div>
  </div>
</div>

<div class="modal" id="achModal" hidden>
  <div class="mbox wide glass codex">
    <button class="x" data-close>×</button>
    <h2 class="title" data-l="🏆 Succès"></h2>
    <p class="muted center" id="achCount"></p>
    <div id="achBody" class="pbody"></div>
    <div class="pager" id="achPager"></div>
  </div>
</div>

<div class="modal" id="replayModal" hidden>
  <div class="mbox wide glass codex">
    <button class="x" data-close>×</button>
    <h2 class="title" data-l="🎬 Revoir une partie"></h2>
    <div id="replayBody" class="pbody"></div>
    <div class="pager" id="replayPager"></div>
  </div>
</div>

<div class="modal" id="evoModal" hidden>
  <div class="mbox wide glass">
    <h2 class="title" id="evoTitle"></h2>
    <p class="muted center" id="evoSub"></p>
    <div class="evos" id="evos"></div>
  </div>
</div>

<div class="modal" id="tutoModal" hidden>
  <div class="mbox glass tuto">
    <button class="x" data-close>×</button>
    <div id="tutoBody"></div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/i18n.js"></script>
<script src="js/lang_keys.js"></script>
<script src="js/lang_en.js"></script>
<script src="js/lang_es.js"></script>
<script src="js/lang_de.js"></script>
<script src="js/lang_it.js"></script>
<script src="js/lang_pt.js"></script>
<script src="js/lang_ru.js"></script>
<script src="js/lang_zh.js"></script>
<script src="js/lang_ja.js"></script>
<script src="js/decor.js"></script>
<script src="js/sound.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
